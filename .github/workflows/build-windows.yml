name: Build DrMusic for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DrMusic --collect-all yt_dlp --collect-all imageio_ffmpeg app/main.py

      - name: Package
        run: |
          Compress-Archive -Path dist/DrMusic.exe -DestinationPath DrMusic-windows.zip -Force

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DrMusic - Latest
          body: "Build automático da versão mais recente do DrMusic para Windows."
          files: DrMusic-windows.zip
          make_latest: true
          fail_on_unmatched_files: true
